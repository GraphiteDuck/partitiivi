<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suomen partitiiviharjoitus</title>
  <style>
    :root {
      --bg-page: #121212;
      --bg-card: #1a1a1a;
      --bg-inner: #141414;
      --border: #2c2c2c;
      --text-main: #f0f0f0;
      --text-muted: #9e9e9e;
      --accent: #6ab0f3;
      --accent-bg: rgba(106, 176, 243, 0.12);
      --correct: #4caf50;
      --correct-bg: rgba(76, 175, 80, 0.15);
      --wrong: #ef5350;
      --wrong-bg: rgba(239, 83, 80, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 60px 16px;
    }

    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Header & Mode Switch */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .title-group h1 {
      font-family: Georgia, serif;
      font-size: 1.65rem;
      font-weight: 500;
      margin: 0 0 6px 0;
    }

    .title-group p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .mode-toggle {
      display: flex;
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
    }

    .mode-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      color: var(--text-main);
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    /* Progress Box */
    .progress-box {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .progress-bar-track {
      width: 100%;
      height: 8px;
      background: #2b2b2b;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #e0e0e0;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .step-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #1c1c1c;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .pill.current {
      border-color: var(--accent);
      background: #1a2d4c;
      color: #fff;
      font-weight: 600;
    }

    .pill.correct {
      border-color: var(--correct);
      color: var(--correct);
    }

    .pill.wrong {
      border-color: var(--wrong);
      color: var(--wrong);
    }

    /* Question Item */
    .question-block {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .question-block:last-of-type {
      border-bottom: none;
      margin-bottom: 12px;
      padding-bottom: 8px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }

    .badge {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .sentence {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      line-height: 1.5;
      margin: 0 0 12px 0;
    }

    .blank {
      display: inline-block;
      min-width: 90px;
      padding: 2px 12px;
      margin: 0 4px;
      border-bottom: 2px solid var(--text-main);
      background: var(--bg-inner);
      border-radius: 6px 6px 0 0;
      text-align: center;
      font-weight: 600;
    }

    .blank.filled-correct {
      color: var(--correct);
      border-bottom-color: var(--correct);
      background: var(--correct-bg);
    }

    .blank.filled-wrong {
      color: var(--wrong);
      border-bottom-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 18px;
    }

    .hint svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 560px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .quiz-card {
        padding: 18px 14px;
      }
      .sentence {
        font-size: 1.2rem;
      }
    }

    .opt-btn {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #1f242b;
    }

    .opt-btn.selected-correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #fff;
    }

    .opt-btn.selected-wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #fff;
    }

    /* Explanation Box */
    .explanation {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.5;
      background: #1f242b;
      border-left: 4px solid var(--accent);
    }

    .explanation.correct {
      border-left-color: var(--correct);
    }

    .explanation.wrong {
      border-left-color: var(--wrong);
    }

    /* Footer Navigation */
    .footer-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .nav-group {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-btn:hover:not(:disabled) {
      border-color: var(--text-muted);
      background: #242424;
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="quiz-card">
    <div class="header">
      <div class="title-group">
        <h1>Suomen partitiiviharjoitus</h1>
        <p>Valitse oikea sanamuoto lauseeseen (DE / EN -vihjeillä)</p>
      </div>
      <div class="mode-toggle">
        <button id="btnSingle" class="mode-btn active" onclick="setMode('single')">Yksi kerrallaan</button>
        <button id="btnAll" class="mode-btn" onclick="setMode('all')">Näytä kaikki</button>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress-top">
        <span id="progressText"><strong>Kysymys 1 / 8</strong> (0 / 8 vastattu)</span>
        <span>Pisteet: <strong id="scoreText">0 / 8</strong></span>
      </div>
      <div class="progress-bar-track">
        <div id="progressBar" class="progress-bar-fill" style="width: 12.5%;"></div>
      </div>
      <div id="stepPills" class="step-pills"></div>
    </div>

    <div id="questionsContainer"></div>

    <div class="footer-nav">
      <button class="action-btn" onclick="resetQuiz()">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        Aloita alusta
      </button>
      <div id="navButtons" class="nav-group">
        <button id="prevBtn" class="action-btn" onclick="changeStep(-1)">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Edellinen
        </button>
        <button id="nextBtn" class="action-btn" onclick="changeStep(1)">
          Seuraava kysymys
          <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const questions = [
    {
      sentence: ["Ei mitään ", ", kaikki järjestyy kyllä!"],
      hint: "Kein Problem / No problem or worry (perusmuoto: ongelma)",
      options: ["ongelma", "ongelmaa", "ongelman"],
      correct: 1,
      rule: "Kieltolause + mitään",
      explanation: "Sanan 'mitään' ja kieltosanan 'ei' kanssa käytetään aina partitiivia: Ei mitään ongelmaa / Ei mitään hätää."
    },
    {
      sentence: ["Voitko auttaa ", " tämän laatikon kanssa?"],
      hint: "Kannst du mir helfen? / Can you help me? (perusmuoto: minä)",
      options: ["minulle", "minut", "minua"],
      correct: 2,
      rule: "Partitiiviverbi (auttaa)",
      explanation: "Saksassa 'helfen' vaatii datiivin (mir -> minulle), mutta suomessa 'auttaa' on partitiiviverbi: auttaa minua."
    },
    {
      sentence: ["Odotan ", " pysäkillä."],
      hint: "Ich warte auf den Bus / I am waiting for the bus (perusmuoto: bussi)",
      options: ["bussia", "bussin", "bussille"],
      correct: 0,
      rule: "Partitiiviverbi (odottaa)",
      explanation: "Englannin 'wait for' ja saksan 'warten auf' ilmaistaan suomessa pelkällä partitiivilla: odotan bussia."
    },
    {
      sentence: ["Saisinko kaksi ", ", kiitos?"],
      hint: "Zwei Kaffee, bitte / Two coffees, please (perusmuoto: kahvi)",
      options: ["kahvit", "kahvia", "kahvin"],
      correct: 1,
      rule: "Lukusana (yli 1)",
      explanation: "Numeroiden (2, 3, 4...) jälkeen tulee suomessa aina yksikön partitiivi, ei monikkoa kuten saksassa tai englannissa."
    },
    {
      sentence: ["Luen parhaillaan todella mielenkiintoista ", "."],
      hint: "Ich lese gerade ein Buch / I am currently reading a book (perusmuoto: kirja)",
      options: ["kirjan", "kirja", "kirjaa"],
      correct: 2,
      rule: "Keskeneräinen tekeminen (Prosessi)",
      explanation: "Koska lukeminen on kesken (parhaillaan / -ing), objekti on partitiivissa: luen kirjaa. Jos lukisit sen kokonaan loppuun, sanoisit 'luen kirjan'."
    },
    {
      sentence: ["Toivotan sinulle oikein hyvää ", "!"],
      hint: "Schönes Wochenende! / Have a great weekend! (perusmuoto: viikonloppu)",
      options: ["viikonloppua", "viikonlopun", "viikonloppu"],
      correct: 0,
      rule: "Toivotukset",
      explanation: "Kaikki toivotukset (Hyvää huomenta, Hyvää viikonloppua, Hauskaa matkaa) ovat suomessa partitiivissa."
    },
    {
      sentence: ["Etsimme uutta ", " Helsingistä."],
      hint: "Wir suchen eine neue Wohnung / We are looking for a new apartment (perusmuoto: asunto)",
      options: ["asunnon", "asuntoa", "asunto"],
      correct: 1,
      rule: "Partitiiviverbi (etsiä)",
      explanation: "Etsiminen on prosessi, joka on vielä kesken (asuntoa ei ole vielä löytynyt), joten 'etsiä' vaatii partitiivin: uutta asuntoa."
    },
    {
      sentence: ["Tapasin matkalla monta mukavaa ", "."],
      hint: "Ich habe viele nette Menschen getroffen / I met many nice people (perusmuoto: ihminen)",
      options: ["ihmisiä", "ihmisen", "ihmistä"],
      correct: 2,
      rule: "Määrän ilmaisu (monta) + -nen-sana",
      explanation: "Sanan 'monta' jälkeen tulee aina yksikön partitiivi. Sanatyypin -nen (ihminen) partitiivi päättyy aina -sta/-stä: monta mukavaa ihmistä."
    }
  ];

  let currentStep = 0;
  let viewMode = 'single';
  let userAnswers = new Array(questions.length).fill(null);

  function render() {
    const answeredCount = userAnswers.filter(a => a !== null).length;
    const score = userAnswers.reduce((acc, ans, idx) => acc + (ans === questions[idx].correct ? 1 : 0), 0);

    document.getElementById('progressText').innerHTML =
      `<strong>Kysymys ${currentStep + 1} / ${questions.length}</strong> (${answeredCount} / ${questions.length} vastattu)`;
    document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;

    const progressPercent = Math.max(12.5, (answeredCount / questions.length) * 100);
    document.getElementById('progressBar').style.width = `${progressPercent}%`;

    // Render Pills
    const pillsContainer = document.getElementById('stepPills');
    pillsContainer.innerHTML = '';
    questions.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'pill';
      if (idx === currentStep && viewMode === 'single') btn.classList.add('current');
      if (userAnswers[idx] !== null) {
        btn.classList.add(userAnswers[idx] === questions[idx].correct ? 'correct' : 'wrong');
      }
      btn.textContent = idx + 1;
      btn.onclick = () => {
        currentStep = idx;
        if (viewMode === 'all') {
          const el = document.getElementById(`q-block-${idx}`);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        } else {
          render();
        }
      };
      pillsContainer.appendChild(btn);
    });

    // Render Questions
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    const indicesToShow = viewMode === 'single' ? [currentStep] : questions.map((_, i) => i);

    indicesToShow.forEach(idx => {
      const q = questions[idx];
      const ans = userAnswers[idx];
      const isAnswered = ans !== null;
      const isCorrect = ans === q.correct;

      const block = document.createElement('div');
      block.className = 'question-block';
      block.id = `q-block-${idx}`;

      let blankClass = 'blank';
      let blankText = '____';
      if (isAnswered) {
        blankClass += isCorrect ? ' filled-correct' : ' filled-wrong';
        blankText = q.options[ans];
      }

      const letters = ['a)', 'b)', 'c)'];
      let optionsHTML = '';
      q.options.forEach((opt, oIdx) => {
        let btnClass = 'opt-btn';
        if (isAnswered) {
          if (oIdx === q.correct) btnClass += ' selected-correct';
          else if (oIdx === ans) btnClass += ' selected-wrong';
        }
        optionsHTML += `
          <button class="${btnClass}" onclick="selectAnswer(${idx}, ${oIdx})">
            ${letters[oIdx]} ${opt}
          </button>
        `;
      });

      let explanationHTML = '';
      if (isAnswered) {
        explanationHTML = `
          <div class="explanation ${isCorrect ? 'correct' : 'wrong'}">
            <strong>${isCorrect ? 'Oikein!' : 'Ei aivan.'}</strong> ${q.explanation}
          </div>
        `;
      }

      block.innerHTML = `
        <div class="badges">
          <span class="badge"><strong>Tehtävä ${idx + 1} / ${questions.length}</strong></span>
          <span class="badge">Sääntö: ${q.rule}</span>
        </div>
        <p class="sentence">
          ${q.sentence[0]}<span class="${blankClass}">${blankText}</span>${q.sentence[1]}
        </p>
        <div class="hint">
          <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
          <span>${q.hint}</span>
        </div>
        <div class="options-grid">
          ${optionsHTML}
        </div>
        ${explanationHTML}
      `;

      container.appendChild(block);
    });

    // Update Footer Buttons
    document.getElementById('navButtons').style.display = viewMode === 'single' ? 'flex' : 'none';
    document.getElementById('prevBtn').disabled = currentStep === 0;
    document.getElementById('nextBtn').disabled = currentStep === questions.length - 1;
  }

  function selectAnswer(qIdx, optIdx) {
    userAnswers[qIdx] = optIdx;
    render();
  }

  function changeStep(delta) {
    const next = currentStep + delta;
    if (next >= 0 && next < questions.length) {
      currentStep = next;
      render();
    }
  }

  function setMode(mode) {
    viewMode = mode;
    document.getElementById('btnSingle').classList.toggle('active', mode === 'single');
    document.getElementById('btnAll').classList.toggle('active', mode === 'all');
    render();
  }

  function resetQuiz() {
    userAnswers = new Array(questions.length).fill(null);
    currentStep = 0;
    render();
  }

  render();
</script>

</body>
</html>
